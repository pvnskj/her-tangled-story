<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Her Tangled Story — a 3D birthday adventure</title>
<link rel="stylesheet" href="css/style.css?v=20261018story">
<script type="importmap">
{
  "imports": {
    "three": "./js/vendor/three.module.js",
    "three/addons/": "./js/vendor/addons/"
  }
}
</script>
<!-- Three.js r160 is vendored locally (js/vendor/three.module.js) so the game
     runs fully offline from any static host. Pinned version, no build step. -->
</head>
<body>
  <canvas id="game"></canvas>
  <div id="vignette"></div>
  <div id="grade"></div>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div id="clue-counter">✨ <span id="found-count">0</span> · 32</div>
    <button id="map-toggle" aria-label="open map">🗺️</button>
    <button id="cam-toggle" aria-label="change camera view">🦅</button>
    <button id="sound-toggle" aria-label="toggle sound">🔊</button>
  </div>
  <div id="zone-banner"></div>
  <!-- guidance box: tells her where to go next -->
  <div id="guide-box" class="hidden"><span id="guide-text"></span></div>

  <!-- dialogue bubble -->
  <div id="dialogue" class="hidden"><strong id="dlg-name"></strong><span id="dlg-text"></span></div>

  <!-- floating interaction prompt (villagers, boat) -->
  <div id="interact-prompt" class="hidden"></div>

  <!-- virtual joystick -->
  <div id="joystick"><div id="stick"></div></div>
  <div id="hint-tap">Wander — and see what you find ✨</div>

  <!-- start overlay -->
  <div id="start-overlay">
    <div class="corona-sun" aria-hidden="true"><svg viewBox="0 0 200 200" aria-hidden="true"><defs><radialGradient id="sunGold" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#ffedb3"/><stop offset="70%" stop-color="#f3cd6d"/><stop offset="100%" stop-color="#dfa83e"/></radialGradient><path id="rayL" d="M0 -40 C -8 -56, 5 -70, 0 -97 C -5 -70, 8 -56, 0 -40 Z"/></defs><g fill="#e9ba4f"><use href="#rayL" transform="translate(100 100)"/><use href="#rayL" transform="translate(100 100) rotate(45)"/><use href="#rayL" transform="translate(100 100) rotate(90)"/><use href="#rayL" transform="translate(100 100) rotate(135)"/><use href="#rayL" transform="translate(100 100) rotate(180)"/><use href="#rayL" transform="translate(100 100) rotate(225)"/><use href="#rayL" transform="translate(100 100) rotate(270)"/><use href="#rayL" transform="translate(100 100) rotate(315)"/><use href="#rayL" transform="translate(100 100) rotate(22.5) scale(0.62)"/><use href="#rayL" transform="translate(100 100) rotate(67.5) scale(0.62)"/><use href="#rayL" transform="translate(100 100) rotate(112.5) scale(0.62)"/><use href="#rayL" transform="translate(100 100) rotate(157.5) scale(0.62)"/><use href="#rayL" transform="translate(100 100) rotate(202.5) scale(0.62)"/><use href="#rayL" transform="translate(100 100) rotate(247.5) scale(0.62)"/><use href="#rayL" transform="translate(100 100) rotate(292.5) scale(0.62)"/><use href="#rayL" transform="translate(100 100) rotate(337.5) scale(0.62)"/></g><circle cx="100" cy="100" r="35" fill="url(#sunGold)" stroke="#a87b1f" stroke-width="2"/><circle cx="100" cy="100" r="24" fill="none" stroke="rgba(146,102,16,.6)" stroke-width="2"/><circle cx="100" cy="100" r="5" fill="rgba(146,102,16,.55)"/></svg></div>
    <div class="dust" id="dust" aria-hidden="true"></div>
    <div class="panel">
      <h1>Her Tangled Story</h1>
      <p class="sub">My Man, My Myth, My Legend</p>
      <button id="begin-btn">Begin ✨</button>
    </div>
  </div>

  <!-- photo modal -->
  <div id="photo-modal" class="modal hidden">
    <div class="panel memory">
      <div id="photo-head">Memory <span id="photo-num"></span> of 32</div>
      <div id="photo-frame"></div>
      <p id="photo-caption"></p>
      <button id="photo-close">Keep exploring ✨</button>
    </div>
  </div>

  <!-- riddle modal: fill in the blank OR pick an option to unlock a memory -->
  <div id="riddle-modal" class="modal hidden">
    <div class="panel memory">
      <div id="riddle-head">✨ A memory stirs… ✨</div>
      <p id="riddle-prompt"></p>
      <div id="riddle-input-row">
        <input id="riddle-input" maxlength="2" autocomplete="off" autocapitalize="characters" />
        <button id="riddle-submit">Unlock</button>
      </div>
      <div id="riddle-options" class="hidden"></div>
      <p id="riddle-error" class="hidden">Not quite — try again!</p>
    </div>
  </div>

  <!-- choice modal: questions, this-or-that -->
  <div id="choice-modal" class="modal hidden">
    <div class="panel memory">
      <div id="choice-head">✨ <span id="choice-speaker"></span> ✨</div>
      <p id="choice-prompt"></p>
      <div id="choice-options"></div>
      <p id="choice-response" class="hidden"></p>
      <button id="choice-continue" class="hidden">Continue 💜</button>
    </div>
  </div>

  <!-- game modal: mini-games -->
  <div id="game-modal" class="modal hidden">
    <div class="panel memory game-panel">
      <div id="game-head">🎮 <span id="game-title"></span> 🎮</div>
      <p id="game-intro"></p>
      <div id="game-area"></div>
      <p id="game-outro" class="hidden"></p>
      <button id="game-done" class="hidden">Done! ✨</button>
    </div>
  </div>

  <!-- finale modal -->
  <div id="finale-modal" class="modal hidden">
    <div class="panel finale">
      <div id="finale-head">💜 The Final Memory 💜</div>
      <p id="finale-message"></p>
      <button id="finale-reveal" class="hidden">One last thing… 💜</button>
      <div id="finale-frame"></div>
      <button id="finale-replay">Relive the adventure ↺</button>
    </div>
  </div>

  <!-- world map overlay -->
  <div id="map-overlay" class="modal hidden">
    <div class="panel map-panel">
      <div id="map-head">🗺️ Valley Map</div>
      <canvas id="map-canvas" width="440" height="440"></canvas>
      <p class="map-help">Nine places · Tap a name to walk along the brown paths</p>
      <div id="map-destinations" aria-label="Places to explore"></div>
      <button id="map-close">Close ✕</button>
    </div>
  </div>

  <script type="module" src="js/main.js?v=20261018story"></script>
  <script>
    // Golden dust drifting over the start screen (purely decorative).
    (function () {
      var box = document.getElementById("dust");
      if (!box) return;
      for (var i = 0; i < 42; i++) {
        var s = document.createElement("span");
        var size = 3 + Math.random() * 5;
        s.style.left = (Math.random() * 100) + "%";
        s.style.width = size + "px";
        s.style.height = size + "px";
        s.style.setProperty("--sway", (Math.random() * 90 - 45) + "px");
        s.style.animationDuration = (10 + Math.random() * 10) + "s";
        s.style.animationDelay = (-Math.random() * 18) + "s";
        box.appendChild(s);
      }
    })();
  </script>
</body>
</html>
